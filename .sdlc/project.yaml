# Project policy for the sdlc-supervisor framework.
# Shape documented at docs/sdlc/schemas/project.schema.json.
# Generated by /continue-development's init step on 2026-09-15.
# Hand-edit this file freely as the project's needs change -- it is not
# regenerated automatically once it exists.
framework_version: "0.1.0"
schema_version: "1.0.0"

path_enforcement:
  # Kill switch for the PreToolUse path-enforcement hook. Flip with Bash
  # (sed/python), never with Edit/Write -- editing this file with Edit/Write
  # to turn enforcement off is exactly the self-lock this warning exists to
  # prevent. Absent file or absent key means enforcing.
  enforce: true

budgets:
  max_tasks_per_run: 5
  max_concurrent_implementers: 1
  max_attempts_per_task: 3
  max_verifier_retries: 2
  token_or_time_budget:
    tokens: null
    minutes: 120

verification_profile:
  # Fixed floor -- reproduced verbatim, do not edit. Widen coverage via
  # `widen` below instead of touching this list.
  floor_triggers:
    - authentication_authorization
    - data_persistence_migrations
    - deployment_release_tooling
    - production_mutation_tier_or_above
  # Project-specific additions to the floor, chosen from this project's own
  # documented invariants (AGENTS.md / docs/DECISIONS.md):
  widen:
    - ai_output_validation_and_persistence   # Gemini Nano output must be schema-validated + business-validated before it reaches Room (AGENTS.md #5, ADR-010)
    - raw_capture_immutability                # raw utterance/RawCapture must never be silently rewritten (ADR-007, AGENTS.md #4)
    - wear_transport_idempotency               # watch-to-phone capture transport must stay idempotent on captureId (ARCHITECTURE.md #8-9)
    - natural_language_query_execution         # NL question -> QueryIntent -> deterministic Room query path; model must never emit SQL (ADR-011)

# This project is in "lite" release mode: no live/production system exists
# yet (no deployment target, no cloud backend by design -- see ADR-013).
# /continue-development implements, tests, and commits to a feature branch,
# then stops; merging main and any future release is done by hand. There is
# no supervisor role and no approval-records ledger in this mode.
#
# Revisit this once a real release target exists (e.g. an internal/closed
# testing track on Google Play, or any other live distribution channel) --
# switching to "full" mode at that point is an edit to this file (add back a
# `release:` block with mode/integration_branch/production_branch/
# live_systems, and generate docs/SUPERVISOR_RUNBOOK.md), not a re-init.

# Paths the implementer role may never write to, regardless of any task
# packet's write_paths. This project's own tracking docs.
always_forbidden_paths:
  - "BACKLOG.md"
  - "PROGRESS.md"

owned_files:
  - ".sdlc/**"
  - "docs/sdlc/**"
  - "agents/implementer.md"
  - "agents/verifier.md"
