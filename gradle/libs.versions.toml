# Single source of truth for every pinned version in this build.
# No version string may be duplicated in any module build file -- read them from here.
#
# Kotlin is pinned at 2.3.21 and MUST NOT be bumped past 2.3.x: KSP has no 2.4.x
# release and Room requires KSP, so bumping Kotlin is a hard build break, not a
# deprecation warning.

[versions]
# Build tooling
gradle = "9.7.1"
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.12"
jdkToolchain = "21"

# SDK levels
compileSdk = "37"
targetSdk = "36"
minSdkPhone = "33"
minSdkWatch = "34"

# Libraries
room = "2.8.5"
composeBom = "2026.09.00"
wearComposeMaterial3 = "1.6.2"
activityCompose = "1.13.0"
# Type-safe Compose Navigation for the phone app. 2.10.1 needs kotlin-stdlib 2.1.20 and
# kotlinx-serialization-core 1.7.3 (checked on Google Maven 2026-09-19): fine under the Kotlin 2.3.x pin.
navigationCompose = "2.10.1"
# lifecycle-viewmodel-compose and lifecycle-runtime-compose ship as one release train; one ref for both.
lifecycle = "2.11.0"
mlkitGenaiPrompt = "1.0.0-beta4"
mlkitGenaiSchemaCompiler = "1.0.0-alpha1"
# Already resolved transitively via room-ktx; declared explicitly for core-data. Do not upgrade independently of Room.
kotlinxCoroutines = "1.8.1"
# core-ai's coroutines version, kept separate on purpose. ML Kit's genai-prompt brings
# kotlinx-coroutines-bom:1.7.3, which is what core-ai's classpath already resolves to; core-ai
# declares its use of coroutines explicitly at exactly that version so the dependency is not
# implicit AND the resolved classpath is unchanged. Pointing core-ai at kotlinxCoroutines above
# would silently upgrade it to 1.8.1. Do not merge the two without checking both modules.
kotlinxCoroutinesGenai = "1.7.3"
# JSON reading for core-testing's semantic regression corpus (test infrastructure only).
# 1.11.0 requires kotlin-stdlib 2.3.20 (checked in its Maven Central .module file); its compiler plugin is
# org.jetbrains.kotlin.plugin.serialization at the `kotlin` version above. Do not move to a
# release built against a newer Kotlin without checking it against the Kotlin 2.3.x pin.
kotlinxSerialization = "1.11.0"
# Wear Data Layer client (MessageClient/DataClient/NodeClient) for the WD1 round-trip probe.
playServicesWearable = "19.0.0"

# Host-side (JVM, no device) test tooling -- see docs/proposals/room-schema/TOOLING_NOTES.md
junit4 = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
# On-device (instrumented) test runner for app-phone's vertical-slice test. Kept in step with
# androidxTestCore above: androidx.test:core and androidx.test:runner ship as one release train.
androidxTestRunner = "1.7.0"
# kotlinx-coroutines-test for app-phone's JVM ViewModel tests (Dispatchers.setMain, virtual time).
# 1.9.0 is exactly what app-phone's debugUnitTestRuntimeClasspath already resolves (the Compose
# ui-test artifacts bring it in transitively); declaring it at that version puts it on the test
# compile classpath without changing any resolved version. Kept apart from kotlinxCoroutines above
# (1.8.1, which the same classpath upgrades to 1.9.0) so no existing module's version moves.
kotlinxCoroutinesTest = "1.9.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# Versioned by androidx-compose-bom (no version.ref): declare with platform(libs.androidx.compose.bom).
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Host-side Compose UI tests (Robolectric). Versioned by the BOM.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
# Declares the test activity ui-test-junit4 needs; debug builds only. Versioned by the BOM.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core-genai = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesGenai" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearComposeMaterial3" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenaiPrompt" }
mlkit-genai-schema-compiler = { module = "com.google.mlkit:genai-schema-compiler", version.ref = "mlkitGenaiSchemaCompiler" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: there is deliberately no `kotlin-android` alias here. AGP 9 has built-in
# Kotlin support and hard-fails if org.jetbrains.kotlin.android is applied
# alongside it: "The 'org.jetbrains.kotlin.android' plugin is no longer required
# for Kotlin support since AGP 9.0". An Android module applies only
# android-library (or android-application) and gets Kotlin 2.3.21 from the
# toolchain. See https://kotl.in/gradle/agp-built-in-kotlin. Removed after SS1.3
# hit this; do not add it back.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
