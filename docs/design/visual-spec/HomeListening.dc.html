<!doctype html>

<x-dc>
<helmet>

<div style="width: 412px; height: 915px; background: #F7F4EE; display: flex; flex-direction: column; overflow: hidden; position: relative; color: #22201C;">
  <div style="height: 36px; flex-shrink: 0;"></div>
  
  <div style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px; flex-shrink: 0;">
    
    <div style="flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 600; color: #22201C; letter-spacing: -0.01em; padding-left: 0px;">Activity Ledger</div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">

    <div aria-live="polite" style="display: flex; align-items: center; gap: 8px; color: #2F6B55; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.02em;">
      <div style="width: 8px; height: 8px; border-radius: 4px; background: #2F6B55;"></div><span>Listening…</span></div>

    <div style="width: 220px; height: 220px; border-radius: 110px; background: #D5E8DD55; display: flex; align-items: center; justify-content: center;">
    <div style="width: 168px; height: 168px; border-radius: 84px; background: #D5E8DD; display: flex; align-items: center; justify-content: center;"><div role="button" aria-label="Stop listening" style="width: 112px; height: 112px; border-radius: 56px; background: #2F6B55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(47,107,85,0.28); opacity: 1;"><svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect></svg></div></div></div>
    <div style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6B655B;">Tap to stop · stops by itself when you pause</div>
  </div>
  <div style="border-top: 1px solid #D6CEBF; opacity: 0.4;" aria-hidden="true">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 20px; min-height: 48px; box-sizing: border-box;">
  <div style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6B655B; letter-spacing: 0.02em;">Recent</div></div>
    <div role="button" style="display: flex; gap: 12px; padding: 12px 16px 12px 20px; min-height: 72px; box-sizing: border-box; border-bottom: 1px solid #D6CEBF; align-items: flex-start; background: transparent;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
      <div style="font-size: 17px; line-height: 24px; font-weight: 600; color: #22201C;">Mow lawn</div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;"><span style="font-size: 14px; line-height: 20px; color: #6B655B;">Today, afternoon</span></div>
      <p class="ev" style="font-size: 14px; line-height: 20px; color: #6B655B; text-wrap: pretty;">“I cut the grass this afternoon”</p>
    </div>
    <div aria-label="Logged from phone" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #6B655B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B655B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></div>
  </div><div role="button" style="display: flex; gap: 12px; padding: 12px 16px 12px 20px; min-height: 72px; box-sizing: border-box; border-bottom: 1px solid #D6CEBF; align-items: flex-start; background: transparent;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">

      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;"><span style="font-size: 14px; line-height: 20px; color: #6B655B;">Today, 11:05 AM</span></div>
      
    </div>
    <div aria-label="Logged from phone" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #6B655B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B655B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></div>
  </div>
  </div></div>
  
  <div role="tablist" style="height: 80px; display: flex; background: #EFEAE1; flex-shrink: 0;"><div role="tab" aria-selected="true" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px;">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #D5E8DD; color: #0F3527;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></div>

    </div><div role="tab" aria-selected="false" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px;">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: transparent; color: #6B655B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4.5V8H7"></path><path d="M12 7.5V12l3 2"></path></svg></div>
      <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6B655B;">History</div>
    </div><div role="tab" aria-selected="false" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px;">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: transparent; color: #6B655B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.2A8 8 0 1 1 20 12z"></path></svg></div>
      <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6B655B;">Ask</div>
    </div></div>
  <div style="height: 24px; background: #EFEAE1; flex-shrink: 0;"></div>
</div>
